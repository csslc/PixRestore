# Data paths are intentionally left unset for a portable public release.
manifests: []
test_lq_dir:
test_gt_dir:
output_dir: outputs/pixrestore

# Runtime
seed: 42
global_batch_size: 16
gradient_accumulation_steps: 1
num_workers: 16
mixed_precision: bf16
max_steps: 4000000
checkpoint_steps: 50000
eval_steps: 10000
eval_sampling_steps: 4
save_first_batch: true
resume:
pretrained:

# Logging (set to wandb to enable)
report_to:
project_name: pixrestore


resolution: 512
patch_size: 8
bottleneck_dim: 768

mlp_ratio: 4
encoder_dim_ratio: 3
use_qknorm: true
use_swiglu: true
use_rope: true
use_rmsnorm: true

# Pixel DiT-S
hidden_size: 384
depth: 12
num_heads: 6
# # Pixel DiT-B
# hidden_size: 768
# depth: 12
# num_heads: 12
# # Pixel DiT-L
# hidden_size: 1024
# depth: 24
# num_heads: 16
# # Pixel DiT-XL
# hidden_size: 1152
# depth: 28
# num_heads: 16
# DINOv2.
encoder_type: dinov2s
encoder_dim: 384
encoder_input_size: 448
encoder_layers: [1, 2, 4, 6, 8, 10]
# encoder_type: dinov2b
# encoder_dim: 768
# encoder_input_size: 448
# encoder_layers: [1, 2, 4, 6, 8, 10]
# encoder_type: dinov2l
# encoder_dim: 1024
# encoder_input_size: 448
# encoder_layers: [1, 4, 8, 12, 16, 20]
# Leave empty to download DINOv2 from torch.hub.
# For offline use, set a local clone and/or a .pth checkpoint.
dinov2_repository:
dinov2_checkpoint:
# feature_norm: channel_layernorm | channel_rmsnorm | channel_l2
feature_norm: channel_rmsnorm
gate_temperature: 1.0
# dino_layer_router_mode only supports content
dino_layer_router_mode: content
use_dino_layer_router: true
dino_layer_router_loss_weight: 0.5
use_hierar_loss: true
dino_hierar_loss_weight: 0.5
dino_hierar_loss_type: cosine
average_hierar_loss_weights: false
same_condition_layer_weights: false
# Enable for checkpoints trained with LQ degradation-token gate (e.g. pixrestore-s).
use_lq_degradation_token: true
fixed_train_t:

# Optional DINO-GAN finetuning
use_dino_gan: false
dino_gan_loss_weight: 0.5
dino_gan_learning_rate: 1.0e-4
dino_gan_real_label: 0.8
dino_gan_hidden_ratio: 0.25
dino_gan_max_hidden: 128

# MeanFlow and classifier-free guidance
flow_ratio: 0.5
time_distribution: [uniform, 0, 1.0]
alpha: 0.9
adaptive_loss_power: 0.5
t_eps: 0.05
cfg_ratio: 0.1
cfg_scale: 1.0
use_aelq: true
use_venc: true
cond_strength_aelq_list: [5.0, 1.0]
weak_cond_strength_aelq_list: [0.99, 1.0]
cond_strength_aelq_test: 1.0
cond_strength_venc: 1.0
weak_cond_strength_venc: 1.0
aug_noise: false
use_time_shift: false
time_shift_base_dimension: 4096

# Optimizer
learning_rate: 1.0e-4
adam_betas: [0.9, 0.95]
weight_decay: 1.0e-2
adam_epsilon: 1.0e-8
max_grad_norm: 1.0
lr_scheduler: constant_with_warmup
warmup_steps: 0
ema_decay: 0.9999
